<html>
<head>
<title>registration form</title>
<link type="stylesheet" href="style.css">
<style>
body
{
background-color:#FFFF00;
}
</style>
</head>
<center>
<h1>registration page</h1>
<form action="registration"method="GET">
<label>first name</label><input type="text"name="fname">
<br>
<label>last name</label><input type="text"name="lname"><br>
<label>date of birth</label><input type="date"name="dob"><br>
<label>email</label>
<input type="email"name="email">
<br>
<label>gender</label>
<input type="radio" name="gender">male</input>
<input type="radio" name="gender">female</input>
<br>
<label>phone no</label>
<input type="number" name="phno">
<br>
<label>address</label>
<input type="textarea" rows=5cols=5name="addr">
<br>
<input type="checkbox">accept terms and conditions
<br>
<label>branch</label>
<select name="ops">
<option value=05>cse</option>
<option value=66>csm</option>
<option value=02>eee</option>
<option value=04>ece</option>
</select>
<br>
<button type="submit">submit</button>
<button type="reset">reset</button>
</form>
</center>
</body>
</html>
